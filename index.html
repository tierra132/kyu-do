<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>弓道 ― 皆中</title>
<style>
:root{color-scheme:dark;--bg:#1b1410;--fg:#f4ead8;--ac:#e8453c}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Hiragino Mincho ProN","Yu Mincho",serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%}
#m{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom);background:rgba(20,12,8,.78);text-align:center}
h1{font-size:44px;margin:0;letter-spacing:.2em;text-shadow:0 3px 0 var(--ac)}
.s{font-size:13px;opacity:.85;margin:0;line-height:1.6}
button{font:inherit;border:2px solid var(--fg);background:#2b1f17;color:var(--fg);border-radius:12px;padding:10px 16px;font-size:15px}
.go{background:var(--ac);border-color:#fff;font-weight:bold;width:240px}
.sw{width:34px;height:34px;border-radius:50%;padding:0;margin:0 4px}
.on{outline:3px solid #fff}
input[type=range]{width:240px;accent-color:var(--ac)}
</style></head><body>
<canvas id="c"></canvas>
<button id="bk" onclick="home()" style="position:fixed;top:32px;left:8px;display:none;padding:4px 10px;font-size:13px;z-index:5">☰ 戻る</button>
<div id="m">
<h1>弓道</h1><p class="s">射法八節 ― 目指すは皆中</p>
<div>弓力 <b id="kv">16</b> kg<br><input id="k" type="range" min="10" max="22" value="16"></div>
<div id="sw"></div>
<button class="go" onclick="go('real')">本番 ― 四つ矢</button>
<button class="go" style="background:#2b1f17" onclick="go('free')">射込み練習</button>
<p class="s">指を置き下へなぞる＝引き分け<br>引き切ると「会」。スマホを傾けて狙い、指を保って伸び合い<br>指を離すと離れ。弓力で矢の速さと扱いやすさが変わります</p>
</div>
<script>
const C=document.getElementById('c'),g=C.getContext('2d');let W,H;
function rs(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;C.width=W*d;C.height=H*d;g.setTransform(d,0,0,d,0,0)}
rs();addEventListener('resize',rs);
let kilo=16,col='#e8453c',mode='real',aimS='full',S='menu',p=0,t=0,y0=0,px=0,py=0,ax=0,ay=0,fl=0,shots=[],msg='',v=0,drop=0,ox=0,oy=0,cur=null;
const $=id=>document.getElementById(id),R_=(a,b)=>a+Math.random()*(b-a),cl=(x,a,b)=>Math.max(a,Math.min(b,x)),Lp=(a,b,k)=>a+(b-a)*k;
['#e8453c','#2f6fed','#f2c230','#f4ead8'].forEach((c,i)=>{const b=document.createElement('button');b.className='sw'+(i?'':' on');b.style.background=c;b.onclick=()=>{col=c;[...$('sw').children].forEach(x=>x.classList.remove('on'));b.classList.add('on')};$('sw').appendChild(b)});
$('k').oninput=e=>{kilo=+e.target.value;$('kv').textContent=kilo};
let sensor=false,gm=0,bt=0,gp=0,bp=0,AC=null,sOn=false;
function orf(e){if(e.gamma==null)return;sensor=true;gm=e.gamma;bt=e.beta}
function home(){S='menu';$('m').style.display='flex';$('bk').style.display='none'}
function go(m){mode=m;shots=[];S='ready';msg='';p=0;$('m').style.display='none';$('bk').style.display='block';
try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}
if(!sOn){sOn=true;try{if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission)DeviceOrientationEvent.requestPermission().then(r=>{if(r==='granted')addEventListener('deviceorientation',orf)}).catch(()=>{});else addEventListener('deviceorientation',orf)}catch(e){}}}
function snd(kind,lv){if(!AC)return;const n=AC.currentTime,sh=kind=='shot',len=sh?.22:.18,b=AC.createBuffer(1,AC.sampleRate*len,AC.sampleRate),d=b.getChannelData(0);
for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/d.length*(sh?14:9));
const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type=kind=='miss'?'lowpass':'bandpass';f.frequency.value=sh?1200+lv*2500:kind=='hit'?2200:500;
const gn=AC.createGain();gn.gain.value=(sh?.25:.35)+lv*.6;s.connect(f);f.connect(gn);gn.connect(AC.destination);s.start(n);
if(!sh){const o=AC.createOscillator(),og=AC.createGain();o.frequency.value=kind=='hit'?240:90;og.gain.setValueAtTime(.3+lv*.3,n);og.gain.exponentialRampToValueAtTime(.001,n+.15);o.connect(og);og.connect(AC.destination);o.start(n);o.stop(n+.2)}}
const Tm=()=>11.5-0.4*kilo;
function amp(t){return(0.07+0.35*Math.max(0,1-t/2.5)+0.22*Math.max(0,t-Tm()))*(0.7+0.04*(kilo-10))}
function wob(t){const A=amp(t);
return{x:A*(Math.sin(t*1.7)+.5*Math.sin(t*4.3+1)+.15*Math.sin(t*13)),y:A*(Math.cos(t*1.3)+.5*Math.sin(t*3.9)+.15*Math.sin(t*11))}}
C.addEventListener('pointerdown',e=>{
if(S==='ready'){S='draw';y0=e.clientY;p=0;msg=''}
else if(S==='result'){S=(mode==='real'&&shots.length>=4)?'end':'ready';p=0}
else if(S==='end'){S='menu';$('m').style.display='flex'}});
C.addEventListener('pointermove',e=>{
if(S==='draw'){p=cl((e.clientY-y0)/(H*.28),0,1);if(p>=1){S='kai';t=0;ax=R_(-1.4,1.4);ay=R_(-1.4,1.4);gp=gm;bp=bt;px=e.clientX;py=e.clientY}}
else if(S==='kai'&&!sensor){ax=cl(ax+(e.clientX-px)*.02,-3,3);ay=cl(ay+(e.clientY-py)*.02,-3,3);px=e.clientX;py=e.clientY}});
function up(){if(S==='draw'){S='ready';p=0;msg='不射：引き分けが足りません'}else if(S==='kai')release()}
C.addEventListener('pointerup',up);C.addEventListener('pointercancel',up);
const Rt=()=>W*.108,Wb=()=>W*.12;
function release(){
const q=Math.min(1,t/3.5),w=wob(t);ox=ax+w.x;oy=ay+w.y;
v=(40+2.2*kilo)*(.82+.18*q);drop=.8*(5625/(v*v)-1);
const j=.04+(1-q)*.5,lx=ox+(aimS=='half'?Wb()/Rt()/2:0)+R_(-j,j),ly=oy+drop+R_(-j,j),hit=Math.hypot(lx,ly)<1;
let n=[];if(t<2)n.push('早気ぎみ：もっと伸び合いを');if(t>Tm()+2)n.push('詰まり：伸び過ぎ。弓力に合った時間で離す');
if(!n.length)n.push(t<Tm()?'良い伸び合い':'そろそろ限界');
cur={lx,ly,hit,t,n:n.join('／'),dur:56/v};fl=0;S='fly';snd('shot',cl((kilo-10)/12,0,1))}
function ln(a,b,c,d,w,co){g.strokeStyle=co;g.lineWidth=w;g.lineCap='round';g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.stroke()}
function L2(a,b,w,co){ln(a[0],a[1],b[0],b[1],w,co)}
function tgt(x,y,r){[1,.8,.6,.4,.2].forEach((k,i)=>{g.fillStyle=i%2?'#1c1c1c':'#f7f2e6';g.beginPath();g.arc(x,y,r*k,0,7);g.fill()});g.strokeStyle='#1c1c1c';g.lineWidth=Math.max(1,r*.04);g.beginPath();g.arc(x,y,r,0,7);g.stroke()}
function txt(s,x,y,sz,co,al){g.font='bold '+sz+'px "Hiragino Mincho ProN",serif';g.textAlign=al||'center';g.fillStyle=co||'#f4ead8';g.shadowColor='rgba(0,0,0,.6)';g.shadowBlur=4;g.fillText(s,x,y);g.shadowBlur=0}
// ---- 射型キーフレーム (h単位, p=0弓構え/.3打起し/.55大三/1会) ----
const KB=[[.33,.62],[.27,.99],[.38,.96],[.47,.90]],KR=[[.23,.62],[.21,.99],[.06,.97],[-.02,.90]],KRE=[[.10,.62],[.15,.88],[-.10,.92],[-.26,.92]],KLE=[[.22,.64],[.19,.88],[.25,.91],[.27,.85]];
function ip(a,pp){const K=[0,.3,.55,1],i=pp>=1?2:pp<.3?0:pp<.55?1:2;let k=cl((pp-K[i])/(K[i+1]-K[i]),0,1);k=k*k*(3-2*k);return[Lp(a[i][0],a[i+1][0],k),Lp(a[i][1],a[i+1][1],k)]}
function archer(x,gy,h,pp,br){
const P=a=>[x+a[0]*h,gy-a[1]*h],B=ip(KB,pp),BH=P(B),RHk=ip(KR,pp),RH=P([RHk[0],RHk[1]+br]),RE=P(ip(KRE,pp)),LE=P(ip(KLE,pp)),k2=cl((pp-.3)/.7,0,1),SL=P([Lp(.02,.06,k2),.79]),SR=P([Lp(-.02,-.09,k2),.79]),skin='#e9b98d';
g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(x,gy+.01*h,.32*h,.035*h,0,0,7);g.fill();
let hg=g.createLinearGradient(x-.25*h,0,x+.25*h,0);hg.addColorStop(0,'#0e1729');hg.addColorStop(.5,'#2a3b66');hg.addColorStop(1,'#0e1729');g.fillStyle=hg;
g.beginPath();g.moveTo(...P([-.08,.52]));g.lineTo(...P([.08,.52]));g.lineTo(...P([.26,.02]));g.lineTo(...P([-.26,.02]));g.fill();
[-.1,-.03,.04,.11].forEach(i=>L2(P([i*.6,.5]),P([i*2.2,.03]),1,'rgba(255,255,255,.14)'));
g.fillStyle='#f4f0e6';[-.17,.17].forEach(i=>{g.beginPath();g.ellipse(...P([i,.012]),.065*h,.02*h,0,0,7);g.fill()});
let wg=g.createLinearGradient(x-.09*h,0,x+.09*h,0);wg.addColorStop(0,'#cfcabc');wg.addColorStop(.5,'#fffdf6');wg.addColorStop(1,'#d9d4c6');g.fillStyle=wg;
g.beginPath();g.moveTo(...P([-.09,.8]));g.lineTo(...P([.09,.8]));g.lineTo(...P([.075,.5]));g.lineTo(...P([-.075,.5]));g.fill();
g.fillStyle='#0b0b0f';g.fillRect(x-.082*h,gy-.56*h,.164*h,.045*h);L2(P([.0,.8]),P([.045,.7]),1.5,'#b9b3a2');
L2(P([.01,.8]),P([.025,.88]),.04*h,skin);
g.fillStyle=skin;g.beginPath();g.ellipse(...P([.03,.93]),.048*h,.058*h,0,0,7);g.fill();
g.beginPath();g.moveTo(...P([.075,.935]));g.lineTo(...P([.098,.915]));g.lineTo(...P([.073,.905]));g.fill();
g.fillStyle='#151210';g.beginPath();g.ellipse(...P([.02,.945]),.052*h,.05*h,0,Math.PI,0);g.fill();g.beginPath();g.ellipse(...P([-.01,.92]),.03*h,.045*h,0,0,7);g.fill();
L2(P([.056,.943]),P([.07,.943]),1.6,'#222');L2(P([.06,.903]),P([.076,.903]),1.4,'#a05a4a');
g.fillStyle='#d7a77c';g.beginPath();g.ellipse(...P([.02,.925]),.01*h,.016*h,0,0,7);g.fill();
L2(SL,LE,.07*h,'#f6f2e8');L2(LE,BH,.045*h,skin);
const tx=B[0]-Lp(.10,.16,k2),yT=B[1]+.87,yB=B[1]-.43,T=P([tx,yT]),Bt=P([tx,yB]);
g.strokeStyle='#26190f';g.lineWidth=Math.max(3,.018*h);g.lineCap='round';g.beginPath();g.moveTo(...T);g.quadraticCurveTo(BH[0],(T[1]+BH[1])/2,...BH);g.quadraticCurveTo(BH[0],(Bt[1]+BH[1])/2,...Bt);g.stroke();
L2(BH,P([B[0],B[1]+.2]),Math.max(4,.022*h),'#b4854c');
g.strokeStyle='#fff';g.lineWidth=1.2;g.beginPath();g.moveTo(...T);g.lineTo(...RH);g.lineTo(...Bt);g.stroke();
const dx=BH[0]-RH[0],dy=BH[1]-RH[1],d=Math.hypot(dx,dy)||1,ex=[RH[0]+dx/d*(d+.08*h),RH[1]+dy/d*(d+.08*h)];
L2(RH,ex,Math.max(2,.008*h),'#efe3c6');L2(RH,[RH[0]+dx/d*.07*h,RH[1]+dy/d*.07*h],Math.max(3,.014*h),col);L2([ex[0]-dx/d*.04*h,ex[1]-dy/d*.04*h],ex,Math.max(2.5,.01*h),'#8a8d92');
L2(SR,RE,.07*h,'#f9f5eb');L2(RE,RH,.045*h,skin);
g.fillStyle='#7d4f2a';g.beginPath();g.arc(RH[0],RH[1],.03*h,0,7);g.fill();g.fillStyle=skin;g.beginPath();g.arc(BH[0],BH[1],.03*h,0,7);g.fill()}
function dojo(){let b=g.createLinearGradient(0,0,0,H);b.addColorStop(0,'#efe1c4');b.addColorStop(.78,'#d4b27c');b.addColorStop(.78,'#b9854d');b.addColorStop(1,'#6e4a2b');g.fillStyle=b;g.fillRect(0,0,W,H);
g.strokeStyle='rgba(90,60,30,.22)';g.lineWidth=2;for(let i=0;i<9;i++){g.beginPath();g.moveTo(i*W/8,0);g.lineTo(i*W/8,H*.78);g.stroke()}
g.strokeStyle='rgba(50,30,10,.3)';g.lineWidth=1;for(let i=0;i<8;i++){g.beginPath();g.moveTo(0,H*.78+i*H*.03);g.lineTo(W,H*.78+i*H*.03);g.stroke()}
g.fillStyle='#4a6b3a';g.fillRect(0,H*.7,W,H*.08);tgt(W-30,H*.62,13)}
const ST=['足踏み','胴造り','弓構え','打起し','引分け','会','離れ','残心'];
function steps(i){ST.forEach((s,j)=>txt(s,W*(j+.5)/8,44,j==i?14:11,j==i?'#ffd34d':'rgba(255,255,255,.6)'))}
function hud(){txt('弓力 '+kilo+'kg',12,22,14,'#fff','left');
if(mode==='real'){for(let i=0;i<4;i++){g.fillStyle=i<shots.length?(shots[i]?'#2e9d4a':'#c33'):'rgba(60,40,20,.5)';g.beginPath();g.arc(W-20-i*24,17,9,0,7);g.fill()}}
else txt('射込み '+shots.length+'本 中'+shots.filter(x=>x).length,W-12,22,14,'#fff','right')}
// ---- 視点：目線 ----
function scene(){let s=g.createLinearGradient(0,0,0,H);s.addColorStop(0,'#b9d4e4');s.addColorStop(.28,'#e6edf0');s.addColorStop(.29,'#7a5632');s.addColorStop(.58,'#4a321c');s.addColorStop(.59,'#7da552');s.addColorStop(1,'#35592a');g.fillStyle=s;g.fillRect(0,0,W,H);
g.fillStyle='rgba(0,0,0,.07)';for(let i=0;i<70;i++)g.fillRect(i*97%W,H*.3+(i*53%(H*.28)),14+(i%5)*9,2);
g.strokeStyle='rgba(255,255,255,.1)';for(let i=-4;i<5;i++){g.beginPath();g.moveTo(W/2+i*8,H*.6);g.lineTo(W/2+i*W*.4,H);g.stroke()}
const cx=W/2,cy=H*.43,R=Rt();g.fillStyle='rgba(0,0,0,.2)';g.fillRect(cx-R*1.15,cy+R*.95,R*2.3,R*.15);tgt(cx,cy,R)}
function vig(){let r=g.createRadialGradient(W/2,H*.43,W*.15,W/2,H*.43,Math.max(W,H)*.72);r.addColorStop(0,'rgba(0,0,0,0)');r.addColorStop(1,'rgba(0,0,0,.6)');g.fillStyle=r;g.fillRect(0,0,W,H)}
function bowBody(cx,cy,al,dx){const w=Wb(),R=Rt(),Ht=R*1.25,x=cx+dx;g.save();g.globalAlpha=al;
let gr=g.createLinearGradient(x-w/2,0,x+w/2,0);gr.addColorStop(0,'#1b1209');gr.addColorStop(.3,'#4b3321');gr.addColorStop(1,'#1b1209');g.fillStyle=gr;
g.beginPath();g.moveTo(x-w*.32,-10);g.lineTo(x+w*.32,-10);g.lineTo(x+w/2,cy-Ht/2);g.lineTo(x+w/2,H+10);g.lineTo(x-w/2,H+10);g.lineTo(x-w/2,cy-Ht/2);g.fill();
g.fillStyle='#b98f55';g.fillRect(x-w/2,cy-Ht/2,w,Ht);
for(let y=cy-Ht/2+2;y<cy+Ht/2;y+=3.2){ln(x-w/2,y,x+w/2,y+1.2,1,'rgba(70,40,15,.7)')}
ln(x-w/2,cy-Ht/2,x+w/2,cy-Ht/2,3,'#2a1a0c');ln(x-w/2,cy+Ht/2,x+w/2,cy+Ht/2,3,'#2a1a0c');
g.fillStyle='#3a2418';g.fillRect(x-w/2,cy+Ht/2,w,R*.55);
g.restore();return cy+Ht/2+R*.55}
function bow(cx,cy,sx){g.save();g.translate(cx,0);g.scale(sx,1);g.translate(-cx,0);
bowBody(cx,cy,.16,-Wb()*.09);bowBody(cx,cy,.16,Wb()*.09);const by=bowBody(cx,cy,.7,0),w=Wb(),R=Rt();
g.fillStyle='#e9b98d';g.beginPath();g.roundRect(cx-w*.62,by-R*.42,w*1.35,R*.9,w*.3);g.fill();
g.strokeStyle='rgba(120,70,40,.5)';g.lineWidth=1;for(let i=1;i<4;i++){g.beginPath();g.moveTo(cx-w*.55,by-R*.42+i*R*.2);g.lineTo(cx+w*.2,by-R*.42+i*R*.2);g.stroke()}
g.fillStyle='#f2c8a0';g.beginPath();g.ellipse(cx+w*.48,by-R*.38,w*.17,R*.17,0,0,7);g.fill();
if(sx>0){ln(cx+w*.58,H+5,cx+w*.52,by-R*.45,3,'#efe3c6');ln(cx+w*.58,H+5,cx+w*.57,H*.9,7,col)}
g.restore();return[cx+w*.5,by-R*.4]}
let last=0;
function loop(ts){requestAnimationFrame(loop);const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
if(S==='kai'){t+=dt;if(sensor){const G=.12*(.75+.05*(kilo-10))*(.5+cl(amp(t)/.5,0,1));ax=cl(ax+(gm-gp)*G,-3,3);ay=cl(ay-(bt-bp)*G,-3,3);gp=gm;bp=bt}}
if(S==='fly'){fl+=dt/cur.dur;if(fl>=1){shots.push(cur.hit);S='result';snd(cur.hit?'hit':'miss',cl((kilo-10)/12,0,1))}}
const R=Rt(),w=S==='kai'?wob(t):{x:0,y:0};
if(S==='menu'||S==='ready'||S==='draw'){dojo();archer(W*.4,H*.8,H*.5,p,0);hud();
const hint=S==='ready'?(msg||'指を置いて、下へゆっくりなぞる'):'';
txt(hint,W/2,H*.93,16,'#fff');
if(S==='draw'){g.fillStyle='rgba(0,0,0,.3)';g.fillRect(W*.2,H*.95,W*.6,7);g.fillStyle=col;g.fillRect(W*.2,H*.95,W*.6*p,7)}}
else if(S==='kai'||S==='fly'){const bx=(S==='kai'?ax+w.x:ox),by=(S==='kai'?ay+w.y:oy),cx=W/2+bx*R,cy=H*.43+by*R;
scene();
if(S==='kai'){const th=bow(cx,cy,1);vig();hud();
const sc=(W-40)/(Tm()+3.5),y=64;g.fillStyle='#777';g.fillRect(20,y,2.5*sc,9);g.fillStyle='#2e9d4a';g.fillRect(20+2.5*sc,y,(Tm()-2.5)*sc,9);g.fillStyle='#c33';g.fillRect(20+Tm()*sc,y,3.5*sc,9);g.fillStyle='#fff';g.fillRect(20+Math.min(t,Tm()+3.5)*sc-2,y-4,4,17);
txt('会 '+t.toFixed(1)+'秒',W/2,y+28,14);
txt('スマホを傾けて狙う',W/2,H*.96,14,'#fff');
g.save();g.beginPath();const iw=W*.34,ih=H*.27,ix=8,iy=H-ih-34;g.roundRect(ix,iy,iw,ih,10);g.clip();g.fillStyle='rgba(240,226,196,.92)';g.fillRect(ix,iy,iw,ih);archer(ix+iw*.33,iy+ih*.97,Math.min(ih*.9,iw*1.05),1,Math.sin(t*2)*.002);g.restore()}
else{const sx=Math.cos(Math.min(fl*3,1)*Math.PI),th=bow(cx,cy,sx);vig();
const tr=Math.min(1,fl),lx=W/2+cur.lx*R,ly=H*.43+cur.ly*R,x0=th[0],y0=th[1],ex=Lp(x0,lx,tr),ey=Lp(y0,ly,tr)-Math.sin(tr*Math.PI)*H*.07*Math.pow(75/v,3),Ln=60*(1-tr)+5;
ln(ex-Ln*.1,ey+Ln*.8,ex,ey,Math.max(1.5,4*(1-tr)+1),col);if(tr>=1){g.fillStyle='#fff';g.beginPath();g.arc(lx,ly,2.5,0,7);g.fill()}}}
else if(S==='result'||S==='end'){dojo();const R2=Math.min(W,H)*.28,cx=W/2,cy=H*.4;tgt(cx,cy,R2);
if(cur){const d=Math.hypot(cur.lx,cur.ly),k=d>2.2?2.2/d:1,mx=cx+cur.lx*R2*k,my=cy+cur.ly*R2*k;ln(mx-4,my+26,mx,my,4,col);g.fillStyle='#fff';g.beginPath();g.arc(mx,my,3,0,7);g.fill()}
if(S==='result'&&cur){txt(cur.hit?'中り！':'外れ',W/2,H*.12,34,cur.hit?'#2e9d4a':'#c33');
const dx=cur.lx,dy=cur.ly,pos=(Math.abs(dx)<.3&&Math.abs(dy)<.3)?'正中':(Math.abs(dy)>.3?(dy>0?'下':'上'):'')+(Math.abs(dx)>.3?(dx>0?'右':'左'):'');
txt('矢所：'+pos+'　矢勢 '+v.toFixed(0)+'m/s　落差 '+(drop>=0?'＋':'')+drop.toFixed(2),W/2,H*.71,15,'#3b2a1a');

if(S==='end'){const n=shots.filter(x=>x).length;txt(n===4?'皆中！！':n+'中 / 4射',W/2,H*.12,38,n===4?'#e8453c':'#3b2a1a');txt(n===4?'見事な皆中です':n>=3?'あと一本！':'残心を大切に',W/2,H*.71,18,'#3b2a1a');txt('タップでメニューへ',W/2,H*.93,15,'#fff')}
