</style></head><body><canvas id="scene"></canvas><div class="vignette"></div><div id="aimBadge" class="hidden">会 · 照準を調整</div><div class="hud"><div class="top"><div><div class="brand">弓 道 譚　/　KYUDO CHRONICLE</div><div class="heading" id="phase">射位につく</div><div class="progress"><div id="bar"></div></div></div><div class="badge" id="count">稽古　一射目</div></div><div class="bottom"><div class="guide"><div class="gt" id="gt">準備を整える</div><div class="gd" id="gd">「稽古を始める」から一射を始めます。</div><div class="metrics"><div class="metric"><small>引き分け</small><b id="dm">—</b></div><div class="metric"><small>会</small><b id="km">—</b></div><div class="metric"><small>照準のずれ</small><b id="am">—</b></div></div></div><div class="actions" id="actions"><button id="begin" class="primary">稽古を始める</button></div><div class="tip" id="tip">案内に従って一射ずつ進めてください。</div></div></div><div id="toast" class="hidden"></div><div id="modal"><div class="dialog"><div class="seal">弓</div><div class="brand">KYUDO CHRONICLE · PROTOTYPE</div><h1>一射の稽古</h1><p>背中越しに引き分け、会に入ると的・矢・弓の籐を目印に狙います。照準を合わせてから離れを行い、矢所を確かめましょう。</p><button id="start" class="primary">稽古を始める</button><button id="sensor" class="ghost">傾きセンサーを有効にする</button><p class="small">センサーが使えない場合は画面をドラッグして狙えます。これは操作確認用の試作で、実際の射法や矢の物理を完全再現するものではありません。</p></div></div>

function dojo(){c.fillStyle=grad(0,H,'#162e29','#6d8068');c.fillRect(0,0,W,H);let hy=H*.34;c.fillStyle='#a5b28d';c.fillRect(0,hy,W,H*.18);for(let i=0;i<30;i++){let x=(i*79+23)%W,y=hy+(i%5)*H*.022;el(x,y,10+i%4*5,15+i%3*7,['#405d47','#587453','#354d3c','#7d8d69'][i%4])}c.fillStyle='#302a22';c.fillRect(0,0,W,H*.19);poly([[0,H*.15],[W,H*.12],[W,H*.19],[0,H*.23]],'#4a3a2b');for(let i=0;i<7;i++)ln(0,H*(.03+i*.027),W,H*(.03+i*.027)-H*.015,'#101b17',Math.max(2,H*.004));for(let x of [W*.04,W*.18,W*.82,W*.96]){poly([[x-W*.018,H*.17],[x+W*.018,H*.17],[x+W*.025,H*.79],[x-W*.025,H*.79]],'#30271f','#98754e');ln(x-W*.01,H*.2,x-W*.013,H*.76,'#c0a07555',2)}c.fillStyle=grad(H*.35,H,'#a29372','#3b4d40');c.fillRect(0,H*.35,W,H*.65);for(let i=1;i<13;i++){let t=i/13,y=H*.35+H*.65*t*t;ln(0,y,W,y,'#e4d1a12b')}for(let i=-5;i<=5;i++)ln(W*.5+i*W*.045,H*.35,W*.5+i*W*.22,H,'#dfc99b29');c.fillStyle='#4a3c2e';c.fillRect(0,H*.19,W,H*.15);for(let i=0;i<13;i++)ln(i*W/12,H*.19,i*W/12,H*.34,'#c6aa7855');c.save();c.globalAlpha=.12;poly([[W*.16,H*.18],[W*.24,H*.18],[W*.62,H*.69],[W*.43,H*.69]],'#fff0bf');poly([[W*.66,H*.18],[W*.71,H*.18],[W*.88,H*.62],[W*.76,H*.62]],'#fff0bf');c.restore()}
function archer(p){let cx=W*.49,s=clamp(Math.min(W/390,H/740),.72,1.15),foot=H*.83,head=H*.275+H*.012*p,bw=W*.115*s;el(cx,foot+7,bw*1.6,10,'#07171277');poly([[cx-bw*.38,head+H*.105],[cx+bw*.38,head+H*.105],[cx+bw*.48,head+H*.29],[cx+bw*.95,foot],[cx+bw*.16,foot],[cx,foot-H*.03],[cx-bw*.15,foot],[cx-bw*.94,foot],[cx-bw*.48,head+H*.29]],'#101d1d','#5b6658');for(let i=-3;i<=3;i++)ln(cx+i*bw*.12,head+H*.17,cx+i*bw*.23,foot-5,'#78827350');poly([[cx-bw*.44,head+H*.08],[cx+bw*.44,head+H*.08],[cx+bw*.57,head+H*.25],[cx+bw*.42,head+H*.31],[cx-bw*.42,head+H*.31],[cx-bw*.57,head+H*.25]],'#e6e1d2','#a0ac9d');poly([[cx,head+H*.09],[cx+bw*.3,head+H*.11],[cx+bw*.13,head+H*.28],[cx,head+H*.25]],'#c9d0c2');rr(cx-bw*.48,head+H*.255,bw*.96,H*.028,2,'#202923');rr(cx-bw*.13,head+H*.047,bw*.26,H*.055,4,'#cda98a');el(cx,head+H*.015,bw*.30,H*.047,'#20221f','#0b100e');el(cx,head-H*.002,bw*.28,H*.041,'#1c211f');poly([[cx-bw*.16,head+H*.02],[cx+bw*.1,head+H*.02],[cx+bw*.13,head+H*.10],[cx+bw*.06,head+H*.16],[cx-bw*.08,head+H*.12],[cx-bw*.18,head+H*.05]],'#171c1a','#3a4138');ln(cx-bw*.07,head+H*.04,cx-bw*.06,head+H*.12,'#696e60');let A=[cx-bw*.38,head+H*.105],B=[cx+bw*.38,head+H*.105],elL=[cx-bw*(.58+p*.3),head+H*(.16-p*.03)],haL=[cx-bw*(.55+p*.38),head+H*(.23-p*.1)],elR=[cx+bw*(.70-p*.1),head+H*(.16+p*.015)],haR=[cx+bw*(.5-p*.04),head+H*(.23-p*.08)];function arm(a,b,d){ln(a[0],a[1],b[0],b[1],'#b7b9aa',bw*.18);ln(a[0],a[1],b[0],b[1],'#eee9dc',bw*.12);ln(b[0],b[1],d[0],d[1],'#dcd8c9',bw*.15);el(d[0],d[1],bw*.09,bw*.065,'#cda88a','#8c745d')}arm(A,elL,haL);arm(B,elR,haR);let bx=cx+bw*(.94+p*.05),by=head+H*.18,bh=H*.4;c.beginPath();c.moveTo(bx,by-bh*.55);c.quadraticCurveTo(bx+bw*.75,by+bh*.08,bx,by+bh*.55);c.strokeStyle='#171c19';c.lineWidth=7*s;c.stroke();c.beginPath();c.moveTo(bx,by-bh*.55);c.quadraticCurveTo(bx+bw*.5,by+bh*.04,bx,by+bh*.55);c.strokeStyle='#a77b4d';c.lineWidth=4*s;c.stroke();c.beginPath();c.moveTo(bx,by-bh*.55);c.lineTo(haL[0],haL[1]);c.lineTo(bx,by+bh*.55);c.strokeStyle='#e3d7b7';c.lineWidth=1.1;c.stroke();for(let i=0;i<10;i++){let y=by-bh*.03+i*bh*.009;ln(bx-3*s,y,bx+3*s,y+3*s,'#d9bc7c',1)}if(state==='ready'||state==='drawing'){rr(W*.23,H*.69,W*.54,5,3,'#f1e4c833');rr(W*.23,H*.69,W*.54*p,5,3,'#dfc17d');if(state==='ready')txt('↓',W*.5,H*.735,26,'#f2d99b')}}
function target(){let x=W*.48,y=H*.36,r=Math.min(W,H)*.085;poly([[x-r*1.55,y-r*1.25],[x+r*1.55,y-r*1.25],[x+r*1.85,y+r*1.9],[x-r*1.85,y+r*1.9]],'#65543d','#c0a575',2);for(let i=0;i<7;i++)ln(x-r*1.48,y-r*1.1+i*r*.42,x+r*1.48,y-r*1.1+i*r*.42,'#d4bd8c33');el(x,y,r*1.16,r*1.16,'#d6d1bd','#342f28',2);el(x,y,r*.96,r*.96,'#272d29','#d6d1bd',1.5);el(x,y,r*.72,r*.72,'#e9e3d1','#272d29',1.5);el(x,y,r*.47,r*.47,'#272d29','#d6d1bd',1.5);el(x,y,r*.24,r*.24,'#e9e3d1','#272d29',1.5);return{x,y,r}}
function aimScene(){dojo();let t=target(),bx=W*.83,top=H*.25,bh=H*.46;c.beginPath();c.moveTo(bx,top);c.quadraticCurveTo(bx-W*.105,H*.48,bx,top+bh);c.strokeStyle='#171d19';c.lineWidth=Math.max(10,W*.034);c.stroke();c.beginPath();c.moveTo(bx,top);c.quadraticCurveTo(bx-W*.105,H*.48,bx,top+bh);c.strokeStyle='#a77848';c.lineWidth=Math.max(6,W*.02);c.stroke();c.beginPath();c.moveTo(bx,top);c.lineTo(W*.78,H*.50);c.lineTo(bx,top+bh);c.strokeStyle='#e3d7bb';c.lineWidth=1.3;c.stroke();for(let i=0;i<15;i++){let y=H*.44+i*H*.007;ln(bx-W*.017,y,bx+W*.013,y+H*.006,'#d9bd82',2)}poly([[W*.02,H*.82],[W*.08,H*.70],[W*.17,H*.64],[W*.22,H*.68],[W*.18,H*.75],[W*.27,H*.78],[W*.25,H*.88],[W*.08,H*.94]],'#e4dfd0','#8e9b8d');poly([[W*.08,H*.82],[W*.15,H*.72],[W*.19,H*.73],[W*.15,H*.82],[W*.22,H*.84],[W*.20,H*.89]],'#c6a283','#96775e');let ex=W*.53+aim.x*W*.11,ey=H*.62+aim.y*H*.11;ln(W*.78,H*.73,ex,ey,'#e9d7b1',2.2);poly([[W*.76,H*.72],[W*.79,H*.70],[W*.785,H*.74]],'#9b6c42');ln(W*.75,H*.70,W*.78,H*.74,'#f1e4c9');let rx=t.x+aim.x*W*.15,ry=t.y+aim.y*H*.13;c.strokeStyle='#e8d29a';c.lineWidth=1.4;c.beginPath();c.arc(rx,ry,10,0,Math.PI*2);c.stroke();ln(rx-17,ry,rx-5,ry,'#f3e7c9');ln(rx+5,ry,rx+17,ry,'#f3e7c9');ln(rx,ry-17,rx,ry-5,'#f3e7c9');ln(rx,ry+5,rx,ry+17,'#f3e7c9');rr(12,H*.29,108,47,9,'#10251ddd','#d6b87955');txt('照準位置',66,H*.29+17,10,'#e8d9b6');txt(`X ${aim.x.toFixed(2)}  Y ${aim.y.toFixed(2)}`,66,H*.29+34,10,'#f4ead2');if(state==='result'&&shot){let xx=t.x+shot.x*W*.12,yy=t.y+shot.y*H*.1;ln(xx-10,yy-4,xx+8,yy+3,'#a87945',3);poly([[xx+8,yy+3],[xx+2,yy-3],[xx+1,yy+5]],'#e4d5b3')}return t}
function render(){c.clearRect(0,0,W,H);if(['kai','release','result'].includes(state)){aimScene();if(state==='release'&&shot){let t=clamp((performance.now()-releaseAt)/600,0,1);ln(W*.77,H*.72,W*.77-W*.22*t,H*.72-H*.22*t,'#f5e1b2',2+t);if(t>=1){state='result';showResult()}}}else{dojo();archer(state==='drawing'?pull:0)}requestAnimationFrame(render)}
function ui(p,t,d,v){$('phase').textContent=p;$('gt').textContent=t;$('gd').textContent=d;$('bar').style.width=v*100+'%'}function actions(arr){let a=$('actions');a.innerHTML='';arr.forEach(o=>{let b=document.createElement('button');b.textContent=o.label;b.className=o.cls||'';b.onclick=o.fn;a.appendChild(b)})}function begin(){ $('modal').classList.add('hidden');state='ready';pull=0;aim={x:0,y:0};shot=null;$('toast').classList.add('hidden');$('aimBadge').classList.add('hidden');$('dm').textContent='—';$('km').textContent='—';$('am').textContent='—';ui('引き分け','画面を下へスライド','画面中央を押し、指を下方向へゆっくり引いてください。十分に引くと会に入ります。',0);$('tip').textContent='指を離すと引き分けを確定します。';actions([])}function drawStart(e){if(state!=='ready')return;drag=true;sx=e.clientX;sy=e.clientY;lx=sx;ly=sy;t0=performance.now();pull=0;state='drawing';cv.setPointerCapture?.(e.pointerId);ui('引き分け','そのまま下へ引く','引く距離が進行度になります。ゆっくり滑らかに動かしましょう。',0);actions([])}function drawMove(e){if(!drag)return;pull=clamp((e.clientY-sy)/(H*.27),0,1);$('bar').style.width=pull*100+'%';$('dm').textContent=((performance.now()-t0)/1000).toFixed(1)+'秒'}function drawEnd(){if(!drag)return;drag=false;drawSec=(performance.now()-t0)/1000;if(pull<.72){state='ready';pull=0;ui('引き分け','もう少し下へ','引き分けの進行が足りません。もう一度、下へ引いてください。',0);actions([{label:'やり直す',cls:'primary',fn:()=>{actions([])}}]);return}state='kai';pull=1;k0=performance.now();$('dm').textContent=drawSec.toFixed(1)+'秒';$('aimBadge').classList.remove('hidden');$('am').textContent='調整中';ui('会・狙い','的を見て狙いを定める','十字の照準を画面ドラッグまたはスマホの傾きで動かします。狙いが決まったら「離れを行う」を押してください。',.68);$('tip').textContent='的・矢・弓の籐の位置関係を見て照準を調整します。';actions([{label:'狙いを中央へ戻す',cls:'ghost',fn:()=>{aim={x:0,y:0};baseG=null;baseB=null}},{label:'離れを行う',cls:'primary',fn:shoot}])}cv.addEventListener('pointerdown',e=>{if(state==='ready')drawStart(e);else if(state==='kai'){drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture?.(e.pointerId)}});cv.addEventListener('pointermove',e=>{if(state==='drawing')drawMove(e);else if(state==='kai'&&drag){aim.x=clamp(aim.x+(e.clientX-lx)/(W*.4),-1.5,1.5);aim.y=clamp(aim.y+(e.clientY-ly)/(H*.4),-1.5,1.5);lx=e.clientX;ly=e.clientY;$('am').textContent=Math.round(Math.hypot(aim.x,aim.y)*100)+'%'}});cv.addEventListener('pointerup',()=>{if(state==='drawing')drawEnd();else if(state==='kai')drag=false});cv.addEventListener('pointercancel',()=>drag=false);function shoot(){if(state!=='kai')return;kaiSec=(performance.now()-k0)/1000;shot={x:aim.x+(Math.random()-.5)*.035,y:aim.y+(Math.random()-.5)*.035};releaseAt=performance.now();state='release';$('aimBadge').classList.add('hidden');$('km').textContent=kaiSec.toFixed(1)+'秒';ui('離れ','矢が放たれた','矢の軌道と矢所を確認します。',.86);actions([])}function showResult(){let dist=Math.hypot(shot.x,shot.y),hit=dist<.72;results.push({hit,dist});$('toast').innerHTML=(hit?'的中':'外れ')+`<small>中心からのずれ ${Math.round(dist*100)} · 引き分け ${drawSec.toFixed(1)}秒 · 会 ${kaiSec.toFixed(1)}秒</small>`;$('toast').classList.remove('hidden');ui('一射の結果',hit?'的中。矢所を確認しましょう':'惜しい一射。狙いを調整しましょう',`今回の判定：${hit?'的中':'外れ'}。照準位置に基づいて矢所を表示しています。`,1);$('tip').textContent=`稽古記録：${results.filter(r=>r.hit).length}/${results.length} 的中`;actions([{label:'もう一射',cls:'primary',fn:()=>{n++;$('count').textContent=`稽古　${n}射目`;$('toast').classList.add('hidden');begin()}},{label:'狙いを試す',cls:'ghost',fn:()=>{shot=null;aim={x:0,y:0};state='kai';k0=performance.now();$('toast').classList.add('hidden');$('aimBadge').classList.remove('hidden');ui('会・狙い','照準を調整する','画面をドラッグして照準を動かし、「離れを行う」で射ます。',.68);actions([{label:'狙いを中央へ戻す',cls:'ghost',fn:()=>aim={x:0,y:0}},{label:'離れを行う',cls:'primary',fn:shoot}])} }])}async function sensorOn(){try{if(!('DeviceOrientationEvent'in window)){alert('このブラウザではセンサーを使えません。画面ドラッグで狙えます。');return}if(typeof DeviceOrientationEvent.requestPermission==='function'&&await DeviceOrientationEvent.requestPermission()!=='granted'){alert('許可されませんでした。画面ドラッグで狙えます。');return}addEventListener('deviceorientation',e=>{if(state!=='kai'||e.gamma==null||e.beta==null)return;if(baseG===null){baseG=e.gamma;baseB=e.beta}aim.x=clamp((e.gamma-baseG)/20,-1.5,1.5);aim.y=clamp((e.beta-baseB)/24,-1.5,1.5);$('am').textContent=Math.round(Math.hypot(aim.x,aim.y)*100)+'%'});alert('傾きセンサーを有効にしました。会に入ったら「狙いを中央へ戻す」で基準をリセットできます。')}catch(e){alert('センサーを有効にできませんでした。画面ドラッグで狙ってください。')}}$('start').onclick=begin;$('begin').onclick=begin;$('sensor').onclick=sensorOn;render()})();
</script></body></html>
