:root{--gold:#d8bd7c;--paper:#f2ead8;--panel:#122820ed}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#132923;color:var(--paper);font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;touch-action:none}button{font:inherit;color:var(--paper);background:linear-gradient(#36584a,#1a392f);border:1px solid #d8bd7c99;border-radius:13px;padding:12px 15px;box-shadow:0 4px 14px #0004}button:active{transform:scale(.98)}#scene{position:absolute;width:100%;height:100%;inset:0}.vignette{position:absolute;inset:0;pointer-events:none;background:linear-gradient(#07181266,transparent 22%,transparent 67%,#071812bb)}.hud{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 13px) 14px calc(env(safe-area-inset-bottom) + 13px);pointer-events:none}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.brand{font-size:10px;letter-spacing:.22em;color:#e6ca8d;font-weight:800}.heading{font-size:clamp(19px,5vw,25px);font-weight:850;margin-top:4px;text-shadow:0 2px 12px #0009}.progress{display:none;height:3px;width:210px;max-width:60vw;background:#fff3;margin-top:9px;border-radius:8px;overflow:hidden}.progress div{height:100%;width:0;background:var(--gold)}.badge{font-size:11px;border:1px solid #e3ca8b66;background:#10251fd9;border-radius:30px;padding:7px 10px;white-space:nowrap}.bottom{pointer-events:auto;width:100%;max-width:510px;align-self:center;display:flex;flex-direction:column;gap:9px}.guide{border:1px solid #d8bd7c66;background:linear-gradient(135deg,#10251fee,#234136eb);backdrop-filter:blur(10px);border-radius:17px;padding:13px 15px;box-shadow:0 12px 30px #0004}.gt{font-weight:850;color:#f1dba5;font-size:15px;margin-bottom:4px}.gd{display:none;font-size:12px;line-height:1.55;color:#e2e8dc}.pulltrack{display:none;margin-top:12px}.pullhead{display:flex;justify-content:space-between;gap:8px;font-size:10px;color:#c9d2c5;margin-bottom:6px}.pullrail{height:10px;border-radius:20px;background:#071711;border:1px solid #d8bd7c66;overflow:hidden;position:relative}.pullfill{height:100%;width:0;background:linear-gradient(90deg,#8ca982,#d6bd79 65%,#c77c59);transition:width .05s linear}.pullhint{display:none;font-size:10px;color:#d9c58f;margin-top:5px;min-height:1.4em}.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.actions button{font-size:13px;min-height:43px}.primary{background:linear-gradient(#e0c783,#b39455);color:#1b2a22;font-weight:850;border-color:#f4dda0}.ghost{background:#0e211ddd}.tip{display:none;text-align:center;color:#c5d0c5;font-size:10px;line-height:1.4}#aimBadge{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:#10251fe8;border:1px solid #e3ca8b66;border-radius:30px;padding:6px 12px;font-size:11px;white-space:nowrap}#toast{position:absolute;top:43%;left:50%;transform:translate(-50%,-50%);font-size:clamp(30px,9vw,52px);font-weight:900;letter-spacing:.12em;text-shadow:0 4px 22px #000;text-align:center;pointer-events:none}#toast small{display:block;font-size:12px;letter-spacing:0;margin-top:8px}.hidden{display:none!important}#modal{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:#071812ce;padding:22px;backdrop-filter:blur(5px)}.dialog{width:min(100%,420px);border:1px solid #d8bd7c77;border-radius:24px;background:linear-gradient(145deg,#1d3b31,#10241e);padding:23px;box-shadow:0 24px 80px #0009}.seal{width:46px;height:46px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:24px;margin-bottom:14px}.dialog h1{margin:0;font-size:26px;letter-spacing:.06em}.dialog p{font-size:13px;line-height:1.75;color:#cbd5ca}.dialog button{width:100%;margin-top:9px}.small{font-size:11px!important;color:#9fb0a4!important}.drawslider{position:absolute;right:16px;top:24%;height:43%;width:54px;z-index:2;display:none;pointer-events:auto;touch-action:none;align-items:center;justify-content:center}.drawslider.active{display:flex}.kaiPanel{position:absolute;left:14px;bottom:26%;width:145px;padding:10px 12px;border-radius:13px;background:#10251fe8;border:1px solid #d8bd7c88;z-index:2;pointer-events:none}.kaiTop{display:flex;justify-content:space-between;align-items:center;font-size:11px;margin-bottom:5px}.kaiTop strong{font-size:14px;color:#f1dba5}.kaiRail{height:7px;border-radius:9px;background:#071711;border:1px solid #d8bd7c66;overflow:hidden}.kaiRail div{height:100%;width:0;background:linear-gradient(90deg,#8ca982,#d6bd79,#c77c59)}.kaiHint{font-size:9px;color:#c9d2c5;margin-top:5px}.drawslider.hold{opacity:0;pointer-events:none}.drawrail{height:100%;width:12px;border-radius:12px;border:1px solid #e0c78399;background:linear-gradient(#0a1b15dd,#20382ddd);box-shadow:0 0 0 5px #09181255;position:relative}.drawfill{position:absolute;left:0;right:0;top:0;height:0%;border-radius:12px;background:linear-gradient(#d6bd79,#c77c59)}.drawthumb{position:absolute;left:50%;top:0%;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(#f0d99b,#b39455);color:#17251e;border:2px solid #fff0c4;box-shadow:0 4px 15px #0008;font-size:19px;font-weight:900;touch-action:none}.drawlabel{position:absolute;left:50%;top:-27px;transform:translateX(-50%);white-space:nowrap;background:#10251fe8;border:1px solid #e3ca8b66;border-radius:20px;padding:5px 8px;font-size:10px;color:#f1dba5}.drawfoot{display:none;position:absolute;left:50%;bottom:-28px;transform:translateX(-50%);white-space:nowrap;font-size:10px;color:#f1dba5;text-shadow:0 2px 8px #000}.drawslider .drawrail:after{content:"";position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);width:20px;height:3px;background:#f2dba2;border-radius:3px}@media(min-width:700px){.drawslider{right:calc(50% - 270px);height:40%;top:23%}}@media(min-width:700px){.hud{padding:22px}.bottom{max-width:460px}.guide{padding:15px 18px}}
</style></head><body><canvas id="scene"></canvas><div id="drawslider" class="drawslider"><div class="drawlabel">ここまで引く</div><div class="drawrail"><div id="drawfill" class="drawfill"></div><div id="drawthumb" class="drawthumb">↓</div></div><div class="drawfoot">打起し → 引分け</div></div><div class="vignette"></div><div id="aimBadge" class="hidden">会・狙い</div><div class="hud"><div class="top"><div><div class="brand">弓 道 譚　/　KYUDO CHRONICLE</div><div class="heading" id="phase">射位につく</div><div class="progress"><div id="bar"></div></div></div><div class="badge" id="count">稽古　一射目</div></div><div class="bottom"><div class="guide"><div class="gt" id="gt">準備を整える</div><div class="gd" id="gd">「稽古を始める」から一射を始めます。</div><div class="pulltrack" id="pulltrack"><div class="pullhead"><span>引き分け</span><span id="pullstate">押したまま下へ</span></div><div class="pullrail"><div class="pullfill" id="pullfill"></div></div><div class="pullhint" id="pullhint"></div></div></div><div class="actions" id="actions"><button id="begin" class="primary">稽古を始める</button></div><div class="tip" id="tip">案内に従って一射ずつ進めてください。</div></div></div><div id="kaiPanel" class="kaiPanel hidden"><div class="kaiTop"><span>会の時間</span><strong id="kaiTime">0.0秒</strong></div><div class="kaiTop"><span>伸び合い</span><strong id="nobiLabel">準備</strong></div><div class="kaiRail"><div id="nobiFill"></div></div><div class="kaiHint" id="kaiHint">押し続け、左右に伸び合う</div></div><div id="toast" class="hidden"></div><div id="modal"><div class="dialog"><div class="seal">弓</div><div class="brand">KYUDO CHRONICLE</div><h1>一射の稽古</h1><button id="start" class="primary">稽古を始める</button><button id="sensor" class="ghost">傾きセンサーを有効にする</button></div></div>
<script>
(()=>{const cv=document.querySelector('#scene'),c=cv.getContext('2d'),$=id=>document.getElementById(id);let W=innerWidth,H=innerHeight,D=1,state='intro',pull=0,rawPull=0,drag=false,sx=0,sy=0,lx=0,ly=0,k0=0,aim={x:0,y:0},baseG=null,baseB=null,shot=null,releaseAt=0,n=1,results=[];const art={ready:new Image(),draw:new Image(),kai:new Image(),target:new Image(),wide:new Image()};art.ready.src='assets/archer-dojo.jpg';art.draw.src='assets/draw-dojo.jpg';art.kai.src='assets/kai-aim.jpg';art.target.src='assets/target-result.jpg';art.wide.src='assets/dojo-wide.jpg';function cover(im,alpha=1){if(!im||!im.complete||!im.naturalWidth)return false;let sc=Math.max(W/im.width,H/im.height),w=im.width*sc,h=im.height*sc;c.save();c.globalAlpha=alpha;c.drawImage(im,(W-w)/2,(H-h)/2,w,h);c.restore();return true}const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);cv.width=W*D;cv.height=H*D;cv.style.width=W+'px';cv.style.height=H+'px';c.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();function ln(x,y,X,Y,col,w=1){c.beginPath();c.moveTo(x,y);c.lineTo(X,Y);c.strokeStyle=col;c.lineWidth=w;c.stroke()}function el(x,y,rx,ry,fill,stroke=null,lw=1){c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=lw;c.stroke()}}function poly(p,fill,stroke=null,lw=1){c.beginPath();p.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));c.closePath();if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=lw;c.stroke()}}function rr(x,y,w,h,r,fill,stroke=null){c.beginPath();c.roundRect(x,y,w,h,r);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=1;c.stroke()}}function grad(y1,y2,a,b){let g=c.createLinearGradient(0,y1,0,y2);g.addColorStop(0,a);g.addColorStop(1,b);return g}function txt(s,x,y,size,col){c.fillStyle=col;c.font=`600 ${size}px system-ui`;c.textAlign='center';c.fillText(s,x,y)}
function dojo(){c.fillStyle=grad(0,H,'#162e29','#6d8068');c.fillRect(0,0,W,H);let hy=H*.34;c.fillStyle='#a5b28d';c.fillRect(0,hy,W,H*.18);for(let i=0;i<30;i++){let x=(i*79+23)%W,y=hy+(i%5)*H*.022;el(x,y,10+i%4*5,15+i%3*7,['#405d47','#587453','#354d3c','#7d8d69'][i%4])}c.fillStyle='#302a22';c.fillRect(0,0,W,H*.19);poly([[0,H*.15],[W,H*.12],[W,H*.19],[0,H*.23]],'#4a3a2b');for(let i=0;i<7;i++)ln(0,H*(.03+i*.027),W,H*(.03+i*.027)-H*.015,'#101b17',Math.max(2,H*.004));for(let x of [W*.04,W*.18,W*.82,W*.96]){poly([[x-W*.018,H*.17],[x+W*.018,H*.17],[x+W*.025,H*.79],[x-W*.025,H*.79]],'#30271f','#98754e');ln(x-W*.01,H*.2,x-W*.013,H*.76,'#c0a07555',2)}c.fillStyle=grad(H*.35,H,'#a29372','#3b4d40');c.fillRect(0,H*.35,W,H*.65);for(let i=1;i<13;i++){let t=i/13,y=H*.35+H*.65*t*t;ln(0,y,W,y,'#e4d1a12b')}for(let i=-5;i<=5;i++)ln(W*.5+i*W*.045,H*.35,W*.5+i*W*.22,H,'#dfc99b29');c.fillStyle='#4a3c2e';c.fillRect(0,H*.19,W,H*.15);for(let i=0;i<13;i++)ln(i*W/12,H*.19,i*W/12,H*.34,'#c6aa7855');c.save();c.globalAlpha=.12;poly([[W*.16,H*.18],[W*.24,H*.18],[W*.62,H*.69],[W*.43,H*.69]],'#fff0bf');poly([[W*.66,H*.18],[W*.71,H*.18],[W*.88,H*.62],[W*.76,H*.62]],'#fff0bf');c.restore()}
function archer(p){let cx=W*.49,s=clamp(Math.min(W/390,H/740),.72,1.15),foot=H*.83,head=H*.275+H*.012*p,bw=W*.115*s;el(cx,foot+7,bw*1.6,10,'#07171277');poly([[cx-bw*.38,head+H*.105],[cx+bw*.38,head+H*.105],[cx+bw*.48,head+H*.29],[cx+bw*.95,foot],[cx+bw*.16,foot],[cx,foot-H*.03],[cx-bw*.15,foot],[cx-bw*.94,foot],[cx-bw*.48,head+H*.29]],'#101d1d','#5b6658');for(let i=-3;i<=3;i++)ln(cx+i*bw*.12,head+H*.17,cx+i*bw*.23,foot-5,'#78827350');poly([[cx-bw*.44,head+H*.08],[cx+bw*.44,head+H*.08],[cx+bw*.57,head+H*.25],[cx+bw*.42,head+H*.31],[cx-bw*.42,head+H*.31],[cx-bw*.57,head+H*.25]],'#e6e1d2','#a0ac9d');poly([[cx,head+H*.09],[cx+bw*.3,head+H*.11],[cx+bw*.13,head+H*.28],[cx,head+H*.25]],'#c9d0c2');rr(cx-bw*.48,head+H*.255,bw*.96,H*.028,2,'#202923');rr(cx-bw*.13,head+H*.047,bw*.26,H*.055,4,'#cda98a');el(cx,head+H*.015,bw*.30,H*.047,'#20221f','#0b100e');el(cx,head-H*.002,bw*.28,H*.041,'#1c211f');poly([[cx-bw*.16,head+H*.02],[cx+bw*.1,head+H*.02],[cx+bw*.13,head+H*.10],[cx+bw*.06,head+H*.16],[cx-bw*.08,head+H*.12],[cx-bw*.18,head+H*.05]],'#171c1a','#3a4138');ln(cx-bw*.07,head+H*.04,cx-bw*.06,head+H*.12,'#696e60');let A=[cx-bw*.38,head+H*.105],B=[cx+bw*.38,head+H*.105],q=clamp(p,0,1),elL=[cx-bw*(.66+q*.20),head+H*(.035+q*.105)],haL=[cx-bw*(.43+q*.52),head+H*(.055+q*.19)],elR=[cx+bw*(.66+q*.18),head+H*(.035+q*.11)],haR=[cx+bw*(.43+q*.46),head+H*(.055+q*.18)];function arm(a,b,d){ln(a[0],a[1],b[0],b[1],'#b7b9aa',bw*.18);ln(a[0],a[1],b[0],b[1],'#eee9dc',bw*.12);ln(b[0],b[1],d[0],d[1],'#dcd8c9',bw*.15);el(d[0],d[1],bw*.09,bw*.065,'#cda88a','#8c745d')}arm(A,elL,haL);arm(B,elR,haR);let bx=cx+bw*(.94+p*.05),by=head+H*.18,bh=H*.4;c.beginPath();c.moveTo(bx,by-bh*.55);c.quadraticCurveTo(bx+bw*.75,by+bh*.08,bx,by+bh*.55);c.strokeStyle='#171c19';c.lineWidth=7*s;c.stroke();c.beginPath();c.moveTo(bx,by-bh*.55);c.quadraticCurveTo(bx+bw*.5,by+bh*.04,bx,by+bh*.55);c.strokeStyle='#a77b4d';c.lineWidth=4*s;c.stroke();c.beginPath();c.moveTo(bx,by-bh*.55);c.lineTo(haL[0],haL[1]);c.lineTo(bx,by+bh*.55);c.strokeStyle='#e3d7b7';c.lineWidth=1.1;c.stroke();for(let i=0;i<10;i++){let y=by-bh*.03+i*bh*.009;ln(bx-3*s,y,bx+3*s,y+3*s,'#d9bc7c',1)}if(state==='ready'||state==='drawing'){rr(W*.23,H*.69,W*.54,5,3,'#f1e4c833');rr(W*.23,H*.69,W*.54*p,5,3,'#dfc17d');if(state==='ready')txt('↓ 引分け',W*.5,H*.735,14,'#f2d99b')}}
function target(){let x=W*.48-aim.x*W*.10,y=H*.36-aim.y*H*.09,r=Math.min(W,H)*.085;poly([[x-r*1.55,y-r*1.25],[x+r*1.55,y-r*1.25],[x+r*1.85,y+r*1.9],[x-r*1.85,y+r*1.9]],'#65543d','#c0a575',2);for(let i=0;i<7;i++)ln(x-r*1.48,y-r*1.1+i*r*.42,x+r*1.48,y-r*1.1+i*r*.42,'#d4bd8c33');el(x,y,r*1.16,r*1.16,'#d6d1bd','#342f28',2);el(x,y,r*.96,r*.96,'#272d29','#d6d1bd',1.5);el(x,y,r*.72,r*.72,'#e9e3d1','#272d29',1.5);el(x,y,r*.47,r*.47,'#272d29','#d6d1bd',1.5);el(x,y,r*.24,r*.24,'#e9e3d1','#272d29',1.5);return{x,y,r}}
function aimScene(){
  // Use the generated aiming artwork as one coherent image. Do not redraw the bow,
  // rattan, hand, arrow or target as separate polygons: that caused them to float apart.
  const im=art.kai;
  if(im && im.complete && im.naturalWidth){
    const scale=Math.max(W/im.width,H/im.height);
    const iw=im.width*scale, ih=im.height*scale;
    // Subtle viewpoint shift gives a small visual response to aiming without adding a fake reticle.
    const ox=(W-iw)/2-aim.x*W*.025;
    const oy=(H-ih)/2-aim.y*H*.02;
    c.drawImage(im,ox,oy,iw,ih);
    c.fillStyle='#06120f22'; c.fillRect(0,0,W,H);
  } else {
    // Asset が読み込めない場合でも、会の画面から的や弓が消えないように描画する。
    dojo();
    const t=target();
    const bx=W*.27, top=H*.18, bot=H*.80, bend=W*.12;
    c.save();
    c.lineCap='round';
    c.beginPath(); c.moveTo(bx,top); c.quadraticCurveTo(bx+bend, H*.49, bx,bot);
    c.strokeStyle='#171b17'; c.lineWidth=Math.max(8,W*.018); c.stroke();
    c.beginPath(); c.moveTo(bx,top); c.quadraticCurveTo(bx+bend,H*.49,bx,bot);
    c.strokeStyle='#9a7044'; c.lineWidth=Math.max(4,W*.008); c.stroke();
    // 弦と矢を弓手の位置に合わせて一続きに描く
    ln(bx,top,bx,bot,'#e7dfc8',1.5);
    const handX=bx+W*.035, handY=H*.61;
    el(handX,handY,W*.025,H*.022,'#c99b7c','#6d4d3a',1);
    ln(handX,handY,bx+W*.012,H*.43,'#f0e9d9',Math.max(3,W*.006));
    ln(bx+W*.012,H*.43,t.x,t.y,'#d9c9a5',Math.max(2,W*.003));
    ln(t.x,t.y,t.x+W*.018,t.y-H*.009,'#eee4ce',1.5);
    c.restore();
  }
  return {x:W*.60-aim.x*W*.025,y:H*.53-aim.y*H*.02,r:Math.min(W,H)*.07};
}
function render(){c.clearRect(0,0,W,H);if(['kai','release','result'].includes(state)){aimScene();if(state==='release'&&shot){let t=clamp((performance.now()-releaseAt)/600,0,1);ln(W*.30,H*.72,W*.30+W*.22*t,H*.72-H*.22*t,'#f5e1b2',2+t);if(t>=1){state='result';showResult()}}}else{if(!cover(state==='drawing'?art.draw:art.ready)){dojo();archer(state==='drawing'?pull:0)}else{c.fillStyle='#06120f55';c.fillRect(0,0,W,H)}}if(state==='kai'){let sec=(performance.now()-k0)/1000;$('kaiTime').textContent=sec.toFixed(1)+'秒';let v=clamp(sec/5,0,1);$('nobiFill').style.width=(v*100)+'%';$('nobiLabel').textContent=sec<1?'伸び始め':sec<3?'伸び合い中':sec<5?'充実':'十分';$('kaiHint').textContent=sec<1?'会を保ち、左右へ伸び合う':sec<3?'焦らず押し開き、引き続ける':'伸び合いを保つ。指を離すと離れ';}requestAnimationFrame(render)}
function ui(p,t,d,v){$('phase').textContent=p;$('gt').textContent=t;$('gd').textContent='';$('bar').style.width=v*100+'%'}function actions(arr){let a=$('actions');a.innerHTML='';arr.forEach(o=>{let b=document.createElement('button');b.textContent=o.label;b.className=o.cls||'';b.onclick=o.fn;a.appendChild(b)})}function begin(){ $('modal').classList.add('hidden');state='ready';pull=0;aim={x:0,y:0};shot=null;drag=false;$('toast').classList.add('hidden');$('aimBadge').classList.add('hidden');$('kaiPanel').classList.add('hidden');$('pullfill').style.width='0%';$('pullstate').textContent='押したまま下へ';$('pullhint').textContent='';$('pulltrack').classList.remove('hidden');$('drawslider').classList.add('active');$('drawslider').classList.remove('hold');$('drawthumb').style.top='0%';$('drawfill').style.height='0%';ui('打起し','押したまま下へ引き分ける','キャラクターは打起しの姿勢です。画面を押し、指を離さずに下へ引き分けてください。会に入っても押したままなら、そのまま狙いを調整できます。',0);$('tip').textContent='引分けから会まで、指を離さずに操作します。指を離すと矢が放たれます。';actions([])}function drawStart(e){if(state!=='ready')return;drag=true;sx=e.clientX;sy=e.clientY;lx=sx;ly=sy;rawPull=0;pull=0;state='drawing';cv.setPointerCapture?.(e.pointerId);ui('引分け','縦スライダーを下端まで引く','スライダーのつまみを下へ動かします。引くほど抵抗が増し、下端に達すると指を離さず会へ移ります。',0);actions([])}function drawMove(e){if(!drag)return;if(state==='drawing'){rawPull=clamp((e.clientY-sy)/(H*.43),0,1);/* 弓の張りを模した非線形抵抗：終盤ほど同じ進捗に必要な指の移動が増える */pull=Math.pow(rawPull,3.2);$('bar').style.width=pull*100+'%';$('pullfill').style.width=pull*100+'%';$('pullstate').textContent=pull<.35?'軽い':pull<.68?'抵抗が増す':pull<.94?'強い抵抗':'会へ';$('pullhint').textContent=pull<.35?'引き始め：指の動きに合わせて弓が開きます。':pull<.68?'中盤：弓の張りが増し、動きが重くなります。':pull<.94?'終盤：さらに引くには大きな指の移動が必要です。':'引き分け完了。指を離さず会へ移ります。';if(pull>=.985){state='kai';pull=1;k0=performance.now();lx=e.clientX;ly=e.clientY;$('pullstate').textContent='会・保持中';$('pullhint').textContent='指を離すと離れ。押したまま小さく動かして狙います。';$('pulltrack').classList.add('hidden');$('aimBadge').classList.remove('hidden');$('kaiPanel').classList.remove('hidden');ui('会・狙い','狙いを定める','カメラが的側へ移りました。照準マークはありません。弓の籐の右側面（半月）や、籐で的が隠れる位置（満月）を目印に、指を押したまま小さく動かして狙います。',.72);$('tip').textContent='指を離した瞬間に離れます。';actions([])}}else if(state==='kai'){aim.x=clamp(aim.x+(e.clientX-lx)/(W*.4),-1.5,1.5);aim.y=clamp(aim.y+(e.clientY-ly)/(H*.4),-1.5,1.5);lx=e.clientX;ly=e.clientY;$('pullstate').textContent='会・狙い調整中'}};const slider=$('drawslider');function sliderStart(e){if(state!=='ready')return;e.preventDefault();drawStart(e);slider.setPointerCapture?.(e.pointerId)}slider.addEventListener('pointerdown',sliderStart);function handleMove(e){if(state==='drawing'&&drag){const r=slider.getBoundingClientRect();rawPull=clamp((e.clientY-r.top)/r.height,0,1);pull=Math.pow(rawPull,3.2);$('drawthumb').style.top=(rawPull*100)+'%';$('drawfill').style.height=(rawPull*100)+'%';$('bar').style.width=pull*100+'%';$('pullfill').style.width=pull*100+'%';$('pullstate').textContent=pull<.35?'軽い':pull<.68?'抵抗が増す':pull<.94?'強い抵抗':'会へ';$('pullhint').textContent=pull<.35?'引き始め：軽く引けます。':pull<.68?'中盤：抵抗が増していきます。':pull<.94?'終盤：さらに引くには大きく動かします。':'引き分け完了。指を離さず会へ。';if(rawPull>=.995){state='kai';pull=1;k0=performance.now();lx=e.clientX;ly=e.clientY;$('drawslider').classList.add('hold');$('pullstate').textContent='会・保持中';$('pullhint').textContent='指を離すと離れ。押したまま画面を動かして狙います。';$('pulltrack').classList.add('hidden');$('aimBadge').classList.remove('hidden');$('kaiPanel').classList.remove('hidden');ui('会・狙い','狙いを定める','会に入りました。照準マークはありません。弓・矢・籐と的の重なりで狙い、指を離すと矢が放たれます。',.72);$('tip').textContent='指を離した瞬間に離れます。';actions([])}}else if(state==='kai'&&drag){aim.x=clamp(aim.x+(e.clientX-lx)/(W*.4),-1.5,1.5);aim.y=clamp(aim.y+(e.clientY-ly)/(H*.4),-1.5,1.5);lx=e.clientX;ly=e.clientY}}cv.addEventListener('pointerdown',e=>{if(state==='kai'&&!drag){drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture?.(e.pointerId)}});addEventListener('pointermove',handleMove);function pointerEnd(){if(state==='drawing'){drag=false;if(rawPull<.995){state='ready';pull=0;rawPull=0;$('drawthumb').style.top='0%';$('drawfill').style.height='0%';$('pullfill').style.width='0%';ui('打起し','もう一度、引分けを','縦のスライダーを下端まで引いてください。途中で離すと打起しに戻ります。',0);actions([]);return;}}if(state==='kai'&&drag){drag=false;shoot();}}slider.addEventListener('pointerup',pointerEnd);slider.addEventListener('pointercancel',pointerEnd);cv.addEventListener('pointerup',pointerEnd);cv.addEventListener('pointercancel',()=>{if(state==='kai')drag=false});cv.addEventListener('pointercancel',()=>{if(state==='drawing'){drag=false;state='ready';pull=0}else if(state==='kai'){drag=false}});function shoot(){if(state!=='kai')return;shot={x:aim.x+(Math.random()-.5)*.035,y:aim.y+(Math.random()-.5)*.035};releaseAt=performance.now();state='release';$('aimBadge').classList.add('hidden');$('kaiPanel').classList.add('hidden');ui('離れ','矢が放たれた','矢の軌道と矢所を確認します。',.86);actions([])}function showResult(){let dist=Math.hypot(shot.x,shot.y),hit=dist<.72;results.push({hit,dist});$('toast').innerHTML=(hit?'的中':'外れ')+`<small>中心からのずれ ${Math.round(dist*100)}</small>`;$('toast').classList.remove('hidden');ui('一射の結果',hit?'的中。矢所を確認しましょう':'惜しい一射。狙いを調整しましょう',`今回の判定：${hit?'的中':'外れ'}。照準位置に基づいて矢所を表示しています。`,1);$('tip').textContent=`稽古記録：${results.filter(r=>r.hit).length}/${results.length} 的中`;actions([{label:'もう一射',cls:'primary',fn:()=>{n++;$('count').textContent=`稽古　${n}射目`;$('toast').classList.add('hidden');begin()}},{label:'狙いを試す',cls:'ghost',fn:()=>{shot=null;aim={x:0,y:0};state='kai';k0=performance.now();$('toast').classList.add('hidden');$('aimBadge').classList.remove('hidden');$('pulltrack').classList.add('hidden');ui('会・狙い','押したまま狙いを調整する','画面を押したまま小さく動かします。指を離すと矢が放たれます。',.72);actions([])} }])}async function sensorOn(){try{if(!('DeviceOrientationEvent'in window)){alert('このブラウザではセンサーを使えません。画面ドラッグで狙えます。');return}if(typeof DeviceOrientationEvent.requestPermission==='function'&&await DeviceOrientationEvent.requestPermission()!=='granted'){alert('許可されませんでした。画面ドラッグで狙えます。');return}addEventListener('deviceorientation',e=>{if(state!=='kai'||!drag||e.gamma==null||e.beta==null)return;if(baseG===null){baseG=e.gamma;baseB=e.beta}aim.x=clamp((e.gamma-baseG)/20,-1.5,1.5);aim.y=clamp((e.beta-baseB)/24,-1.5,1.5);$('pullstate').textContent='会・狙い調整中'});alert('傾きセンサーを有効にしました。会に入ったら「狙いを中央へ戻す」で基準をリセットできます。')}catch(e){alert('センサーを有効にできませんでした。画面ドラッグで狙ってください。')}}$('start').onclick=begin;$('begin').onclick=begin;$('sensor').onclick=sensorOn;render()})();
